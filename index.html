<script src = "visualtoggle.js"></script>
</head>

<body style="background-color: #323232; margin-left:0px; margin-right:0px; margin-top:0px; margin-bottom:0px;" onresize="SizeCheck()">

<!--SECTION: title content-->

<div class="TitleBar" style="background-color: rgba(150, 50, 0, 0.7);  height: 40px; width: 100vw; position: fixed; top: 0px; margin-top:0px; margin-bottom:0px;">
<h3 style = "position: fixed; top: 0px; margin-top:0px; margin-bottom:0px;">ZLABBS</h3>

<!--SECTION: post content-->


<!--SECTION: big image viewer-->

<div name = "ImageView_Big" style = "background-color: rgba(0, 0, 0, 0.4); position: fixed;width: 100vw; height: 100vh; top: 0px; left: 0px;"></div>
<div name = "ImageView_Big" style = "background-color: rgba(0, 0, 0, 0.8); position: fixed;width: 75vw; height: 75vh; top: 12.5vh; left: 12.5vw; overflow: hidden;">
<button onclick='HideContent( "ImageView_Big" );' style="background-color: rgba(0, 0, 0, 0); border-width: 0px; position: fixed; margin-top: 10px; margin-left: 10px; height:20px;">
<img src = "./images/i_close.png" style = "min-height: 100%; min-width: 100%; width: 100%; height: 100%; cursor: pointer;"></img>
</button>

<img name = "ImageView_Big_Img" style="height:90%;  display: block; margin-left: auto; margin-right: auto; margin-top: 2.5%;"> </img>
</div>


<script>
HideContent( "user-hidden" );
HideContent( "ImageView_Big" );
HideContent( "TitleBar_SizeCheck_R_small" )

function SizeCheck()
{
	var WinWidth = window.innerWidth;
	var WinHeight = window.innerHeight; 

//for title bar 
	var ElementTitleBarLeft = document.getElementsByName("TitleBar_SizeCheck_L")[0];
	var ElementTitleBarRight = document.getElementsByName("TitleBar_SizeCheck_R")[0];

	if(window.innerWidth <= 1560)
	{
		HideContent( "TitleBar_SizeCheck_R" );
		ShowContent( "TitleBar_SizeCheck_R_small" );
	}
	else
	{
		HideContent( "TitleBar_SizeCheck_R_small" );

		ShowContent( "TitleBar_SizeCheck_R" );
		ElementTitleBarRight.style.display = "table-cell";
	}

	if(window.innerWidth <= 820)
	{
		HideContent( "TitleBar_SizeCheck_R_small" );
	}
	
	if(window.innerWidth <= 542)
	{
		HideContent( "TitleBar_SizeCheck_L" );
		HideContent( "TitleBar_SizeCheck_R_small" );
	}
	else
	{
		ShowContent( "TitleBar_SizeCheck_L" );
	}

}

SizeCheck();
</script>

</body>
